<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test For My Boyfriend</title>
<style>
body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:20px;display:flex;justify-content:center}
.card{max-width:480px;width:100%;background:#1c1c1e;border-radius:24px;padding:24px;box-shadow:0 10px 40px rgba(255,0,80,.2)}
h1{font-size:22px;text-align:center;margin:0 0 6px}
.sub{color:#aaa;text-align:center;font-size:13px;margin-bottom:20px}
.q{margin:18px 0;padding:16px;background:#262628;border-radius:16px}
.q-title{font-weight:700;font-size:15px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#1c1c1e;color:#fff;font-size:14px;cursor:pointer}
.opt:hover{border-color:#ff2d78}
.opt.selected{background:#ff2d78;border-color:#ff2d78}
button.main{width:100%;padding:16px;border:none;border-radius:14px;background:#ff2d78;color:#fff;font-weight:800;font-size:16px;margin-top:10px;cursor:pointer}
#result{display:none;text-align:center;padding:20px;background:#262628;border-radius:16px;margin-top:20px}
#result h2{color:#ff2d78}
small{color:#777}
</style>
</head>
<body>
<div class="card">
<h1>Quick Test For You 😏</h1>
<p class="sub">No lying. Pick one honestly. It's from my POV.</p>

<div id="quiz"></div>
<button class="main" onclick="finish()">See My Result</button>

<div id="result">
<h2 id="rTitle"></h2>
<p id="rDesc"></p>
<p id="rLine" style="font-weight:700;margin-top:12px"></p>
<small>Now screenshot and send it to me.</small>
</div>
</div>

<script>
const questions = [

{q:"If I'm sitting on your lap in a short dress, where are your hands going?",o:["My waist, holding me tight","My thighs, slowly going up","Everywhere you can get away with","You'd ask me where I want them"]},
{q:"If I whisper 'I've been thinking about you all day' in your ear?",o:["'She's about to be trouble'","'I need to have her right now'","'What has she been thinking exactly?'","'I'm not letting her leave'"]},
{q:"If I say 'be rough tonight', what are you doing?",o:["Pinning me down instantly","Asking how rough I want it","Smirking: 'you sure you can handle it?'","Showing me, not telling me"]},
{q:"If I say 'I'm in charge tonight', how do you react?",o:["Yes ma'am and you let me lead","Pretend to obey but take over later","You get even more turned on","You test me to see if I really can"]},

{q:"If I ask 'what's your dirtiest thought about me right now?'",o:["Something sweet but filthy","Something too dirty to say","Rather show me than say it","Whisper it so I get shy"]},
{q:"If I say 'I had a naughty dream about you'?",o:["Tell you every single detail","Re-create it right now","Show you what happened","Tell me while you touch me"]},
{q:"If I get jealous and say 'prove you only want me'?",o:["Kiss me until I forget","Tell me exactly why you only want me","Show me with actions not words","Get possessive back"]},
{q:"If I ask 'am I good enough for your fantasies?'",o:["You're more than my fantasies","You ARE my fantasy","You + a little wilder would be perfect","You're the reason my fantasies are dirty now"]}
];

let answers = {};
const quizDiv = document.getElementById('quiz');
questions.forEach((qq,i)=>{
let div=document.createElement('div');div.className='q';
div.innerHTML=`<div class="q-title">${i+1}. ${qq.q}</div>`;
qq.o.forEach((opt,j)=>{
let letter = ["A","B","C","D"][j];
let btn=document.createElement('button');btn.className='opt';btn.innerText=`${letter}) ${opt}`;
btn.onclick=()=>{
div.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
answers[i]=letter;
};
div.appendChild(btn);
});
quizDiv.appendChild(div);
});

function finish(){
if(Object.keys(answers).length < 10){alert("Answer all 10 first, don't cheat 😏");return;}
let count={A:0,B:0,C:0,D:0};Object.values(answers).forEach(v=>count[v]++);
let max = Object.keys(count).reduce((a,b)=>count[a]>count[b]?a:b);
const results={
A:{t:"THE OBSESSED LOVER 😍",d:"You don't just want me, you're obsessed with me. Sweet but dangerously into me. Low risk of cheating, high risk of being too attached.",l:"So you're basically whipped for me huh?"},
B:{t:"THE FILTHY ROMANTIC 🥀",d:"You have a dirty mind but you make it hot. You like to tease, build it up, and torture me slowly. You remember exactly what I like.",l:"So you like to make me suffer first?"},
C:{t:"THE DOMINANT BEAST 😈",d:"You want control. And you want me to lose it. Confident, possessive, doesn't ask twice. You fantasize about me begging.",l:"So you think you can handle me?"},
D:{t:"THE SECRET FREAK 🤫",d:"You act chill but your mind is the dirtiest. You're curious, want to try everything, just waiting for me to say yes. You'll surprise me the most.",l:"What are you hiding from me? Tell me now."}
};
document.getElementById('result').style.display='block';
document.getElementById('rTitle').innerText=results[max].t;
document.getElementById('rDesc').innerText=results[max].d;
document.getElementById('rLine').innerText=`Send me: "${results[max].l}"`;
window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script>
</body>
</html>
